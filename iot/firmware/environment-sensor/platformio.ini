; ====================================================================
; Project: Environment Sensor (Smoke / Gas / Temperature) - ESP32
; Graduation Project: Smart Home Privacy Dashboard
; Owner: Quynh
; ====================================================================

[platformio]
default_envs = environment_sensor

[env:environment_sensor]
platform = espressif32 @ ^6.5.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
