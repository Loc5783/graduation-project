; ====================================================================
; Project: Smart Kitchen Gas Leak Warning System (ESP32)
; ====================================================================

[platformio]
default_envs = sensor_node, display_node

[env]
platform = espressif32 @ ^6.5.0
framework = arduino
board = esp32doit-devkit-v1
monitor_speed = 115200
upload_speed = 921600
; upload_port = COM6
; monitor_port = COM6

; --------------------------------------------------------------------
; 1. NODE CẢM BIẾN (ESP32 BẾP)
; --------------------------------------------------------------------
[env:sensor_node]
build_src_filter = 
    +<sensor_node/*>
lib_deps = 
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; --------------------------------------------------------------------
; 2. NODE HIỂN THỊ (ESP32 MÀN HÌNH TFT)
; --------------------------------------------------------------------
[env:display_node]
build_src_filter = 
    +<display_node/*>
lib_deps = 
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1

; --------------------------------------------------------------------
; 3. TOOL TIỆN ÍCH ĐỌC ĐỊA CHỈ MAC
; --------------------------------------------------------------------
[env:get_mac]
build_src_filter = 
    +<get_mac/*>

